<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked · x-keep-focus</title>
    <link rel="stylesheet" href="block.css" />
    <script type="module" src="block.js"></script>
  </head>
  <body>
    <main class="block">
      <div class="block__mark" aria-hidden="true">
        <svg viewBox="0 0 128 128" width="56" height="56">
          <circle
            cx="64"
            cy="64"
            r="40"
            fill="none"
            stroke="currentColor"
            stroke-width="10"
          />
          <circle cx="64" cy="64" r="14" fill="currentColor" />
        </svg>
      </div>
      <h1 class="block__title">Stay focused.</h1>
      <p class="block__focus" id="focus"></p>
      <p class="block__domain" id="domain" hidden></p>
      <a class="block__back" id="go-back" href="#">← Go back</a>
    </main>
  </body>
</html>
